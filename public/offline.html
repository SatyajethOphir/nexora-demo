<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — NEXORA</title>
    <meta name="theme-color" content="#111827" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.03em;
        font-size: 20px;
        margin-bottom: 20px;
        color: #111827;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
        font-weight: 700;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #475569;
        margin: 0 0 24px;
      }
      button {
        background: #111827;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">NEXORA</div>
      <h1>You are currently offline</h1>
      <p>It looks like your connection dropped. Check your Wi-Fi or mobile data and try reloading to continue shopping.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
